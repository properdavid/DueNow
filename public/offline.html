<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Can't reach DueNow</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f7;
        color: #1f1f1f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          background: #111;
          color: #eee;
        }
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(32rem, calc(100vw - 3rem));
        border: 1px solid currentColor;
        border-radius: 10px;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.5;
      }
      button {
        border: 1px solid currentColor;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach DueNow</h1>
      <p>The server did not answer. Retry when DueNow is reachable again.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
